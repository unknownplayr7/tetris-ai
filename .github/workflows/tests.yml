name: Python checks

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install numpy
      - name: Check Python syntax
        run: python -m py_compile main.py board.py pieces.py ai.py tetris_env.py model.py train.py play_model.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
